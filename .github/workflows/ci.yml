name: Run Python Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pydantic

    - name: Test with pytest
      run: |
        python -m pytest -v

  build:
    name: Build Executable (${{ matrix.os }})
    needs: test  # Solo se ejecuta si los tests pasan
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: restaurante_cli_windows.exe
            executable_path: dist/restaurante_cli.exe
          - os: ubuntu-latest
            artifact_name: restaurante_cli_linux
            executable_path: dist/restaurante_cli

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del proyecto y PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller pydantic

      - name: Compilar ejecutable con PyInstaller
        run: |
          pyinstaller --onefile --name "restaurante_cli" main.py

      - name: Renombrar artefacto según S.O.
        shell: bash
        run: |
          mv ${{ matrix.executable_path }} ${{ matrix.artifact_name }}

      - name: Subir artefactos a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: restaurante-cli-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}

  # ==========================================
  # 3. CREAR DRAFT RELEASE (Opcional para Tags)
  # ==========================================
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: binarios/

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binarios/restaurante-cli-windows-latest/restaurante_cli_windows.exe
            binarios/restaurante-cli-ubuntu-latest/restaurante_cli_linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}