name: CI/CD - Build & Release Executables

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 1. ETAPA DE PRUEBAS (CI)
  # ==========================================
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov pydantic

      - name: Ejecutar Tests Unitarios e Integración
        run: |
          python -m pytest tests/ -v

  # ==========================================
  # 2. ETAPA DE COMPILACIÓN (CD)
  # ==========================================
  build:
    name: Build Executable (${{ matrix.os }})
    needs: test  # Solo se ejecuta si la suite de pruebas pasa exitosamente
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: restaurante_cli_windows.exe
            executable_path: dist/restaurante_cli.exe
          - os: ubuntu-latest
            artifact_name: restaurante_cli_linux
            executable_path: dist/restaurante_cli

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del proyecto y PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller pydantic

      - name: Compilar ejecutable con PyInstaller
        run: |
          pyinstaller --onefile --name "restaurante_cli" main.py

      - name: Renombrar artefacto según S.O.
        shell: bash
        run: |
          mv ${{ matrix.executable_path }} ${{ matrix.artifact_name }}

      - name: Subir artefactos a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: restaurante-cli-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}

  # ==========================================
  # 3. CREACIÓN DE GITHUB RELEASE (Solo en Tags)
  # ==========================================
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso requerido para subir binarios a la Release

    steps:
      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: binarios/

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            binarios/restaurante-cli-windows-latest/restaurante_cli_windows.exe
            binarios/restaurante-cli-ubuntu-latest/restaurante_cli_linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}