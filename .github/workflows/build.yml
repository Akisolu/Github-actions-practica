name: CI/CD - Build & Release

on:
  push:
    tags:
      - 'v*' # Se activa al subir tags como v1.0, v1.0.0, v2.1-beta, etc.

jobs:
  # ==========================================
  # 1. COMPILACIÓN DE BINARIOS
  # ==========================================
  build:
    name: Build Executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: restaurante_cli_windows.exe
            executable_path: dist/restaurante_cli.exe
          - os: ubuntu-latest
            artifact_name: restaurante_cli_linux
            executable_path: dist/restaurante_cli

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias y PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller pydantic

      - name: Compilar ejecutable
        run: |
          pyinstaller --onefile --name "restaurante_cli" main.py

      - name: Renombrar binario
        shell: bash
        run: |
          mv ${{ matrix.executable_path }} ${{ matrix.artifact_name }}

      - name: Subir como artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: restaurante-cli-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}

  # ==========================================
  # 2. CREACIÓN DEL GITHUB RELEASE
  # ==========================================
  release:
    name: Publicar Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso necesario para crear releases y adjuntar archivos

    steps:
      - name: Descargar todos los artefactos de la etapa anterior
        uses: actions/download-artifact@v4
        with:
          path: binarios/

      - name: Crear Release y adjuntar ejecutables
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # Genera el changelog automáticamente basado en los commits
          files: |
            binarios/restaurante-cli-windows-latest/restaurante_cli_windows.exe
            binarios/restaurante-cli-ubuntu-latest/restaurante_cli_linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}